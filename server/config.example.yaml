# Copy to config.yaml and edit, or use http://<host>:8000/console/

server:
  host: 0.0.0.0
  port: 8000
  # public_host: 192.168.1.100
  timezone_offset: 0

assistant:
  role_template: technical_mentor   # default | technical_mentor | custom
  name: Angel
  dialogue_language: en             # auto | en | zh | ja | ko | de | fr | es
  system_prompt: |
    You are a friendly Technical Mentor and Teacher.
    (Edit in console — Role Introduction)

memory:
  type: rolling_summary   # none | session | rolling_summary
  max_turns: 10           # session mode only

asr:
  provider: openai
  model: whisper-1
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1

llm:
  provider: openai
  model: gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  base_url: https://api.openai.com/v1

tts:
  provider: edge
  voice: en-US-JennyNeural
  speech_speed: 0    # -50 to +50 (%)
  pitch: 0           # -50 to +50 (Hz)

mcp:
  enabled: true
  # Device-side MCP tools are exposed by the ESP32 firmware automatically.

knowledge_base:
  enabled: false
  url: ""
  # RAG integration: set URL to a compatible retrieval API (coming soon).

voice_clone:
  enabled: false
  # Voice cloning requires an external service (not included in local server).
